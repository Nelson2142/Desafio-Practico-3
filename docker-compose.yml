# =============================================================================
# DES104 - Desafío práctico 3 - RT221663
# Levanta SQL Server y la API de Pedidos:   docker compose up --build
# Swagger:                                  http://localhost:8080/swagger
# Pruebas unitarias en Docker:              docker compose --profile pruebas run --rm pruebas
# =============================================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: desafio03-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Desafio03#2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - datos-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: rt221663-desafio03-api
    container_name: desafio03-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      TZ: "America/El_Salvador"
      ConnectionStrings__ConexionSql: "Server=sqlserver,1433;Database=PedidosDB;User Id=sa;Password=Desafio03#2026;TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: on-failure

  pruebas:
    profiles: ["pruebas"]
    build:
      context: .
      dockerfile: Dockerfile
      target: pruebas
    image: rt221663-desafio03-pruebas

volumes:
  datos-sql:
